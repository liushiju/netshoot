name: release-buildx

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release tag to package, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release-assets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set release version
        run: |
          if [ -n "${{ github.event.inputs.release_version || '' }}" ]; then
            echo "RELEASE_VERSION=${{ github.event.inputs.release_version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          fi

      - name: Build ${{ matrix.arch }} offline image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: netshoot:${{ env.RELEASE_VERSION }}
          load: true

      - name: Export image archive
        run: docker save --output ${{ runner.temp }}/netshoot-${{ env.RELEASE_VERSION }}-linux-${{ matrix.arch }}.tar netshoot:${{ env.RELEASE_VERSION }}

      - name: Compress archive
        run: gzip -f ${{ runner.temp }}/netshoot-${{ env.RELEASE_VERSION }}-linux-${{ matrix.arch }}.tar

      - name: Generate checksum
        run: sha256sum ${{ runner.temp }}/netshoot-${{ env.RELEASE_VERSION }}-linux-${{ matrix.arch }}.tar.gz > ${{ runner.temp }}/netshoot-${{ env.RELEASE_VERSION }}-linux-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: netshoot-${{ env.RELEASE_VERSION }}-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/netshoot-${{ env.RELEASE_VERSION }}-linux-${{ matrix.arch }}.tar.gz
            ${{ runner.temp }}/netshoot-${{ env.RELEASE_VERSION }}-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/netshoot-${{ env.RELEASE_VERSION }}-linux-${{ matrix.arch }}.tar.gz
            ${{ runner.temp }}/netshoot-${{ env.RELEASE_VERSION }}-linux-${{ matrix.arch }}.tar.gz.sha256
          generate_release_notes: true
